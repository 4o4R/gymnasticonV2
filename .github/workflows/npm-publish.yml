# Test and publish a tagged package when a release is published or manually retried.
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package-version.outputs.version }}
      release-version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 14
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev
      - name: Pin node-gyp 9.x
        run: |
          npm install -g node-gyp@9.4.1
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> $GITHUB_ENV
      - id: package-version
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - id: release-version
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish-npm:
    needs: build
    if: needs.build.outputs.package-version == needs.build.outputs.release-version
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 14
          registry-url: https://registry.npmjs.org/
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev
      - name: Pin node-gyp 9.x
        run: |
          npm install -g node-gyp@9.4.1
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> $GITHUB_ENV
      - run: npm ci
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          package_spec=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published to npm"
          else
            npm publish --access public
          fi
      - name: Skip npm publish when no token is configured
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN is not configured; skipping npmjs.org publish"

  publish-gpr:
    needs: build
    if: needs.build.outputs.package-version == needs.build.outputs.release-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 14
          registry-url: https://npm.pkg.github.com/
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev
      - name: Pin node-gyp 9.x
        run: |
          npm install -g node-gyp@9.4.1
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> $GITHUB_ENV
      - run: npm ci
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_spec=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if npm view "$package_spec" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "$package_spec is already published to GitHub Packages"
          else
            npm publish
          fi
